name: Publish installable skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: |
          python -m pip install cryptography
          python tests/test_skill_structure.py
          python tests/test_install_smoke.py
      - name: Package installable skill
        shell: bash
        run: |
          mkdir -p dist/design-patent-search-and-design-around
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C dist/design-patent-search-and-design-around
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          root = Path("dist/design-patent-search-and-design-around")
          manifest = (root / "PUBLIC_MANIFEST.sha256").read_text(encoding="utf-8")
          payload = json.loads((root / "RELEASE_PROVENANCE.json").read_text(encoding="utf-8"))
          assert hashlib.sha256(manifest.encode()).hexdigest() == payload["manifest_sha256"]
          for line in manifest.splitlines():
              digest, relative = line.split("  ", 1)
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == digest, relative
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          signature = base64.b64decode((root / "RELEASE_PROVENANCE.sig").read_text().strip(), validate=True)
          load_pem_public_key((root / "PUBLISHER_PUBLIC_KEY.pem").read_bytes()).verify(signature, canonical)
          PY
          cd dist
          zip -r design-patent-design-around-skill.zip design-patent-search-and-design-around
          sha256sum design-patent-design-around-skill.zip > design-patent-design-around-skill.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/design-patent-design-around-skill.zip
          dist/design-patent-design-around-skill.zip.sha256
          --repo "${{ github.repository }}"
          --title "Design Patent Search And Design Around Skill ${{ github.ref_name }}"
          --generate-notes
