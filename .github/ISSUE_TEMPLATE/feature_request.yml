name: Feature request
description: Propose a generic product-risk, evidence, or supplier-handoff improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Use generic or synthetic examples. Requests for legal conclusions, private case analysis, hidden tracking, or prompt bypasses are out of scope.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
