name: Bug report
description: Report a reproducible public workflow or documentation problem without sharing confidential design files.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post unpublished designs, client names, attorney material, supplier identities, credentials, or private URLs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and version
      placeholder: Windows 11, Codex, v1.0.1
    validations:
      required: true
